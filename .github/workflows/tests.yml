name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin manifest JSON
        run: python -m json.tool plugin.json > /dev/null
        shell: bash
      - name: Compile scripts
        run: python -m compileall -q skills/game-cultural-localization/scripts
      - name: Run unit tests
        run: python -m unittest discover tests -v
        env:
          PYTHONUTF8: "1"
